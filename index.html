<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Lovmind</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        /* iOS doesn't support transparency, use white background as fallback */
        background: transparent;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        /* iOS requires solid background - transparent shows as black */
        background: transparent;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }
      #root {
        width: 100vw;
        height: 100vh;
        /* iOS fallback: use white instead of transparent */
        background: transparent;
      }

      /* iOS-specific override: prevent black screen from transparency */
      @supports (-webkit-touch-callout: none) {
        html, body, #root {
          background: white !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/app.tsx"></script>
  </body>
</html>
