<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <script>
      // Dynamically add interactive-widget for mobile platforms
      (function() {
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        if (isMobile) {
          const viewport = document.querySelector('meta[name="viewport"]');
          if (viewport) {
            viewport.setAttribute('content', viewport.getAttribute('content') + ', interactive-widget=resizes-content');
          }
        }
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#D97757" />
    <title>Lovmind</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html {
        /* iOS doesn't support transparency, use white background as fallback */
        background: transparent;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        /* iOS requires solid background - transparent shows as black */
        background: transparent;
        overflow: hidden;
        margin: 0;
        padding: 0;
      }
      #root {
        width: 100vw;
        height: 100vh;
        /* iOS fallback: use white instead of transparent */
        background: transparent;
      }

      /* iOS-specific override: prevent black screen from transparency */
      @supports (-webkit-touch-callout: none) {
        html, body, #root {
          background: white !important;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/app.tsx"></script>
  </body>
</html>
